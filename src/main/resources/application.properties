# ---------------------------------------------------------------
# Application settings. Passwords are NOT written here: they are read
# from environment variables so they never end up on GitHub.
# ---------------------------------------------------------------
spring.application.name=lab-issue-reporting
server.port=8080

# MySQL connection (override with the DB_URL / DB_USERNAME / DB_PASSWORD environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lab_issue_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# A logged-in session ends after 30 minutes without activity
server.servlet.session.timeout=30m

# Replace the placeholder passwords of the demo accounts with real BCrypt hashes at start-up.
# Set DEMO_ACCOUNTS_ENABLED=false for a real deployment.
app.demo-accounts.enabled=${DEMO_ACCOUNTS_ENABLED:true}

# Always send dates as text like 2026-11-06T09:13:00 (not as numbers)
spring.jackson.serialization.write-dates-as-timestamps=false

# Do not cache the HTML/CSS/JS while developing
spring.web.resources.cache.period=0
app.password-mode=${PASSWORD_MODE:plain}
